<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Encriptador de texto: encripta y desencripta mensajes con un cifrado de sustitución de vocales.">
    <title>Encriptador de Texto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&family=Outfit:wght@100..900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <span class="material-symbols-outlined" aria-hidden="true">encrypted_add</span>
    <h1 class="title">ENCRYPTOR</h1> 
    <h2 class="subtitle">Encripta y desencripta tus mensajes de forma segura</h2> 

    <main class="container">
        <div class="input-container"> 
            <label for="input-text" class="sr-only">Texto a encriptar o desencriptar</label>
            <textarea id="input-text" placeholder="Ingresa el texto aquí"></textarea>
            <div class="buttons">
                <button id="encrypt-btn">Encriptar</button>
                <button id="decrypt-btn">Desencriptar</button>
            </div>
            <p class="info">Escribe o pega tu mensaje y elige una acción. Solo letras minúsculas y sin acento.</p>
            <p id="error-message" class="error hidden" role="alert"></p> 
        </div>

        <div class="output-container hidden">
            <label for="output-text" class="sr-only">Resultado</label>
            <textarea id="output-text" readonly placeholder="Texto encriptado/desencriptado"></textarea>
            <button id="copy-btn">Copiar</button>
            <p class="copy-info">Haz clic en "Copiar" o selecciona el texto y presiona Ctrl+C (o Cmd+C en Mac)</p> 
        </div>

        <section class="history-container hidden" aria-label="Historial">
            <h2>Historial</h2>
            <ul id="history-list"></ul>
        </section>
    </main>

    <script src="script.js"></script> 
</body>
</html>
